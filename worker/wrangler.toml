name = "portfolio-admin"
main = "src/index.js"
compatibility_date = "2024-09-23"

# Preserva as variáveis definidas pelo painel do Cloudflare em vez de apagá-las
# a cada deploy. Precisa ficar AQUI, no topo, antes de qualquer tabela ([assets],
# [[routes]], [vars]): no TOML, toda chave escrita depois de um cabeçalho de
# tabela pertence àquela tabela, e um keep_vars solto lá embaixo vira campo da
# rota e derruba o deploy com erro de configuração.
#
# Sem isto, `wrangler deploy` sobrescreve a configuração remota com a deste
# arquivo — foi o que aconteceu em 08/08/2026: as três variáveis do Access
# estavam declaradas aqui como "" e o deploy zerou a configuração real,
# derrubando a validação de JWT do Worker (que falha fechada, então o painel
# passou a recusar toda chamada com 401).
keep_vars = true

# Painel administrativo (arquivos estáticos em worker/public) e API (/api/*)
# na mesma origem: por isso não existe configuração de CORS neste projeto.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Endereço definitivo do painel. A Cloudflare cria e administra o DNS e o
# certificado desta origem; o acesso é restringido separadamente pelo Access.
[[routes]]
pattern = "admin.pedrodetrindade.com"
custom_domain = true

# ===== Variáveis (texto simples, não secretas) =====
# Estas aparecem no painel do Cloudflare em texto puro. Nenhuma delas é uma
# credencial: são só identificadores de configuração. O único segredo real
# deste projeto é GITHUB_TOKEN, e ele NÃO aparece aqui — vai como Secret
# (ver README do worker, seção "Cloudflare Worker").
[vars]
GITHUB_OWNER = "pedrodetrindade"
GITHUB_REPO = "portfolio"
# O valor que vale é o do painel do Cloudflare, não este. Com keep_vars = true
# a configuração remota é preservada e as chaves daqui não são reaplicadas —
# é a mesma proteção que salva as três variáveis do Access, e ela vale para
# TODAS as vars, inclusive as que estão escritas neste arquivo.
#
# Isto já custou uma conclusão errada: o arquivo dizia feature/portfolio-cms,
# o output de `wrangler deploy` e `wrangler versions view` repetiam esse valor
# (os dois imprimem a configuração local, não a remota), e a leitura natural
# foi "o CMS publica numa branch que o site não serve". O histórico provava o
# contrário — uma publicação do painel mudou nextHintNamePt e a mudança
# apareceu no site, que é servido da main. Alinhado aqui para o arquivo parar
# de contradizer a realidade, e para que remover keep_vars um dia não aponte
# o CMS para uma branch morta.
GITHUB_BRANCH = "main"

# ACCESS_TEAM_DOMAIN, ACCESS_AUD e ADMIN_EMAIL NÃO ficam aqui de propósito.
# Não são segredos (são identificadores de configuração), mas ADMIN_EMAIL é um
# e-mail pessoal e este repositório é público. Eles vivem só no painel do
# Cloudflare (Workers & Pages → portfolio-admin → Settings → Variables), e o
# keep_vars acima é o que garante que um deploy não os apague.
# Sem os três preenchidos o Worker recusa qualquer requisição — "falhar de
# forma fechada". Ver worker/src/access.js e o README, seção F.
